<title>詰み度アニメ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@500;700;900&display=swap">
<style>
/* layout: 16:9の映像ステージを中央に1枚、その下に再生コントロール。夜の駅の一色で統一(単一テーマ) */
:root{color-scheme:dark;--bg:#080a14;--panel:#141a30;--fg:#eef0f8;--muted:#8f97b8;--line:#2a3152;--led:#ffb02e;
  --font-body:"Zen Kaku Gothic New","Noto Sans JP","Noto Sans CJK JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);padding-inline:16px;padding-block:16px 32px}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
#stage{background:var(--bg);display:flex;flex-direction:column;gap:10px}
canvas{width:100%;max-width:100%;aspect-ratio:16/9;display:block;background:#0b0e1c;border:1px solid var(--line);border-radius:4px}
#stage:fullscreen{padding:12px;justify-content:center}
#stage:fullscreen canvas{max-height:calc(100vh - 80px);width:auto;margin:0 auto}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.ctl input[type=range]{flex:1;min-width:140px;accent-color:var(--led)}
button,select{font:inherit;font-size:14px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:7px 14px;cursor:pointer}
#play{background:var(--led);color:#0b0e1c;border-color:var(--led);font-weight:700;min-width:92px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--led);outline-offset:2px}
#time{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);min-width:96px}
p{margin:0;font-size:13px;color:var(--muted);line-height:1.7}
</style>

<div class="wrap">
  <div id="stage">
    <canvas id="cv" lang="ja" width="1920" height="1080"></canvas>
    <div class="ctl">
      <button type="button" id="play">再生</button>
      <input type="range" id="seek" min="0" max="1000" value="0">
      <span id="time">0:00 / 0:00</span>
      <select id="speed"><option value="1">1.0倍</option><option value="1.5">1.5倍</option><option value="2">2.0倍</option><option value="4">4.0倍</option></select>
      <button type="button" id="full">全画面</button>
    </div>
  </div>
  <p>音声はありません。字幕の進みは1秒あたり約6文字の読み上げ速度を想定しています。数字はいただいた原稿のサンプル値のままです。</p>
</div>

<script>
const D=/*__D__*/null;
const AX=["待ち時間","タクシー","宿","暇つぶし","コンビニ","気温"],WT=[5,4,4,2,2,3];
const SC=/*__SC__*/null;
const BASE=SC.findIndex(s=>s.k=="wait"),RULES=[["始発までの待ち時間",5,"3時間30分未満","3:30〜3:45","3:45〜4:00","4:00〜4:15","4時間15分以上"],["タクシー帰還コスト",4,"5千円未満","5千〜1万円","1〜2万円","2〜3万円","3万円以上"],["泊まれる場所",4,"4軒以上","3軒","2軒","1軒","0軒"],["時間を潰せる場所",2,"4軒以上","3軒","2軒","1軒","0軒"],["24時間コンビニ",2,"4店以上","3店","2店","1店","0店"],["冬の最低気温",3,"3℃以上","2〜3℃","1〜2℃","0〜1℃","0℃未満"]];
let TOTAL=0;
SC.forEach(s=>{s.se=s.t.split(/(?<=。)/);s.ss=[];let a=0.4+(s.pre||0);s.se.forEach((x,i)=>{s.ss.push(a);a+=(s.d?s.d[i]:x.length/D.cps)+0.3+(i==0&&s.gap||0)});s.dur=a+0.5+(s.end||0);s.start=TOTAL;TOTAL+=s.dur});

const cv=document.getElementById("cv"),c=cv.getContext("2d"),W=1920,H=1080;
document.documentElement.lang="ja";try{c.lang="ja"}catch(e){} // 漢字を日本語の字形で描く
const C={bg:"#0b0e1c",panel:"#141a30",fg:"#eef0f8",muted:"#8f97b8",line:"#2a3152",led:"#ffb02e",hot:"#ff5d7d",cool:"#5ec8ff"};
const F='"Zen Kaku Gothic New","Noto Sans JP","Noto Sans CJK JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif',LED='"DotGothic16",'+F;
const cl=x=>Math.max(0,Math.min(1,x)),ez=p=>1-Math.pow(1-cl(p),3);
let S,lt; // 現在のシーンとシーン内の経過秒
const A=(k,d=0,dur=.6)=>ez((lt-S.ss[Math.min(k,S.ss.length-1)]-d)/dur);
const last=()=>S.ss.length-1;
function tx(s,x,y,size,col,al="left",w=700,f=F,a=1){if(a<=0)return;c.globalAlpha=a;c.font=`${w} ${size}px ${f}`;c.fillStyle=col;c.textAlign=al;c.textBaseline="alphabetic";c.fillText(s,x,y);c.globalAlpha=1}
function rr(x,y,w,h,r,fill,stroke,a=1){c.globalAlpha=a;c.beginPath();c.roundRect(x,y,w,h,r);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=3;c.stroke()}c.globalAlpha=1}
function wrap(s,max){const out=[];let cur="";for(const ch of s){if(c.measureText(cur+ch).width>max&&cur&&!'。、」?!'.includes(ch)){out.push(cur);cur=ch}else cur+=ch}if(cur)out.push(cur);return out}

function stars(){c.fillStyle=C.bg;c.fillRect(0,0,W,H);c.fillStyle="#1a2140";for(let i=0;i<70;i++){const x=(i*397)%W,y=(i*211)%820;c.fillRect(x,y,3,3)}}
function subtitle(){
  if(lt<S.ss[0]-.05){c.fillStyle="rgba(5,6,12,.86)";c.fillRect(0,884,W,196);return}
  let i=0;for(let k=0;k<S.ss.length;k++)if(lt>=S.ss[k])i=k;
  c.fillStyle="rgba(5,6,12,.86)";c.fillRect(0,884,W,196);
  c.font=`700 48px ${F}`;const ls=wrap(S.se[i],1660);
  ls.forEach((l,n)=>tx(l,W/2,(ls.length>1?955:990)+n*66,48,C.fg,"center"));
}
function brand(){tx("終電で寝過ごしたら詰む駅",80,78,34,C.led,"left",400,LED);tx(D.station,520,78,34,C.fg,"left",400,LED)}
function header(){let hs=68;c.font=`900 ${hs}px ${F}`;while(c.measureText(S.h).width>890&&hs>36){hs-=2;c.font=`900 ${hs}px ${F}`}tx(S.h,80,190,hs,C.fg,"left",900);if(S.sub)tx(S.sub,80,244,32,C.muted,"left",500);
  const i=SC.indexOf(S)-BASE;rr(1000,140,200,58,6,null,C.led);tx("重み ×"+WT[i],1100,181,32,C.led,"center")}
function src(k){tx("出典："+D.src[k],80,866,26,C.muted,"left",500)}
function stamp(sc){const a=A(last(),.9,.5);if(a<=0)return;const s=1.6-.6*a;c.save();c.translate(1090,760);c.rotate(-.12);c.scale(s,s);
  c.globalAlpha=a;c.beginPath();c.arc(0,0,92,0,7);c.fillStyle=C.bg;c.fill();c.strokeStyle=C.hot;c.lineWidth=8;c.stroke();
  tx(sc+"点",0,26,74,C.hot,"center",900,F,a);c.restore()}

const CATC=["#ffb02e","#ff5d7d","#5ec8ff","#7fd88f"],CATN=["いつ帰れるか","いくらで帰れるか","朝まで過ごせる場所","外で待てるか"],CAT=[0,1,2,2,2,3];
function radar(vals,cx=1560,cy=500,R=230,cols){
  const pt=(i,r)=>{const a=-Math.PI/2+i*Math.PI/3;return[cx+Math.cos(a)*r,cy+Math.sin(a)*r]};
  for(let k=1;k<=5;k++){c.beginPath();for(let i=0;i<6;i++){const[x,y]=pt(i,R*k/5);i?c.lineTo(x,y):c.moveTo(x,y)}c.closePath();c.strokeStyle=C.line;c.lineWidth=2;c.stroke()}
  for(let i=0;i<6;i++){const[x,y]=pt(i,R);c.beginPath();c.moveTo(cx,cy);c.lineTo(x,y);c.strokeStyle=C.line;c.stroke();
    const[lx,ly]=pt(i,R+58),on=vals[i]>0;tx(AX[i],lx,ly,cols&&cols[i]?34:30,cols&&cols[i]||(on?C.fg:C.muted),"center",cols&&cols[i]?900:700);
    tx(on?Math.round(vals[i])+"点":"?",lx,ly+38,30,on?C.led:C.muted,"center",700)}
  c.beginPath();for(let i=0;i<6;i++){const[x,y]=pt(i,R*vals[i]/5);i?c.lineTo(x,y):c.moveTo(x,y)}c.closePath();
  c.fillStyle="rgba(255,176,46,.3)";c.fill();c.strokeStyle=C.led;c.lineWidth=5;c.lineJoin="round";c.stroke();
}
function radarNow(){const si=SC.indexOf(S);return D.scores.map((v,j)=>{const sj=j+BASE;return si>sj?v:si==sj?v*A(last(),.9,.8):0})}

const ICON={"ビジネスホテル":"hotel","ネットカフェ":"net","深夜営業の入浴施設":"bath","カラオケ":"kara","24時間ファミレス":"fami","24時間営業":"conv","最寄りまで徒歩":"walk","1月の平均最低気温":"cold","8月の平均最低気温":"warm"};
// ピクトグラム風アイコン。100×100の枠に単色で描く
function ico(name,x,y,s,col){c.save();c.translate(x,y);c.scale(s/100,s/100);c.fillStyle=c.strokeStyle=col;c.lineWidth=8;c.lineCap="round";c.lineJoin="round";
  const L=(...p)=>{c.beginPath();c.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)c.lineTo(p[i],p[i+1]);c.stroke()},O=(a,b,r)=>{c.beginPath();c.arc(a,b,r,0,7);c.fill()};
  ({hotel(){c.fillRect(6,26,11,58);c.fillRect(6,58,88,14);c.fillRect(83,58,11,26);O(32,44,11);c.beginPath();c.roundRect(48,40,46,18,7);c.fill()},
    net(){c.beginPath();c.roundRect(10,16,80,54,6);c.stroke();c.fillRect(44,70,12,12);c.fillRect(26,82,48,9);c.fillRect(22,30,38,7);c.fillRect(22,45,24,7)},
    bath(){c.beginPath();c.ellipse(50,70,40,18,0,-.35,Math.PI+.35);c.stroke();[30,50,70].forEach(a=>{c.beginPath();c.moveTo(a,66);c.bezierCurveTo(a-13,50,a+13,36,a,14);c.stroke()})},
    kara(){O(64,28,20);c.lineWidth=15;L(50,46,24,86);c.lineWidth=5;L(50,20,78,38)},
    fami(){L(30,12,30,88);L(18,12,18,36,42,36,42,12);c.beginPath();c.moveTo(64,10);c.quadraticCurveTo(88,30,80,56);c.lineTo(64,56);c.closePath();c.fill();L(68,56,68,88)},
    conv(){c.fillRect(8,20,84,20);c.beginPath();c.rect(16,40,68,46);c.stroke();c.fillRect(56,56,17,30);c.fillRect(26,54,20,16)},
    walk(){O(56,15,10);L(54,32,46,58);L(46,58,62,88);L(46,58,30,86);L(53,36,72,50);L(53,36,34,50)},
    cold(){c.lineWidth=7;for(let i=0;i<3;i++){const a=i*Math.PI/3,dx=Math.cos(a)*40,dy=Math.sin(a)*40;L(50-dx,50-dy,50+dx,50+dy)}O(50,50,7)},
    warm(){O(50,50,19);c.lineWidth=7;for(let i=0;i<8;i++){const a=i*Math.PI/4;L(50+Math.cos(a)*30,50+Math.sin(a)*30,50+Math.cos(a)*42,50+Math.sin(a)*42)}}})[name]();
  c.restore()}

// 都道府県の境界(国土地理院「地球地図日本」を簡略化)。関東と周辺のみ
const PREF=/*__PREF__*/null;
// 地図を枠内に描き、経度緯度→画面座標の関数を返す。hiは強調する都道府県コード、revは左からの表示幅
const PNAME=["北海道", "青森県", "岩手県", "宮城県", "秋田県", "山形県", "福島県", "茨城県", "栃木県", "群馬県", "埼玉県", "千葉県", "東京都", "神奈川県", "新潟県", "富山県", "石川県", "福井県", "山梨県", "長野県", "岐阜県", "静岡県", "愛知県", "三重県", "滋賀県", "京都府", "大阪府", "兵庫県", "奈良県", "和歌山県", "鳥取県", "島根県", "岡山県", "広島県", "山口県", "徳島県", "香川県", "愛媛県", "高知県", "福岡県", "佐賀県", "長崎県", "熊本県", "大分県", "宮崎県", "鹿児島県", "沖縄県"];
// 地図の枠内で、各都道府県名を置く位置を一度だけ探す(県の内側で境界から最も遠い点)
const LBL={};
function mapLabels(key,B,lon0,lon1,latc,avoid){if(LBL[key])return LBL[key];const cs=Math.cos(latc*Math.PI/180),k=B.w/((lon1-lon0)*cs),dl=B.h/2/k,out=[];
  const inside=(r,x,y)=>{let f=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const a=r[i],b=r[j];if((a[1]>y)!=(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])f=!f}return f};
  for(const code in PREF){let best=null,bs=0;for(let gx=1;gx<28;gx++)for(let gy=1;gy<14;gy++){const x=lon0+(lon1-lon0)*gx/28,y=latc-dl+2*dl*gy/14,r=PREF[code].find(r=>inside(r,x,y));if(!r)continue;
    let d=Math.min((x-lon0)*cs,(lon1-x)*cs,(y-latc+dl)*.7,(latc+dl-y)*.7);for(const p of r){const e=Math.hypot((p[0]-x)*cs,p[1]-y);if(e<d)d=e}for(const p of avoid||[]){const e=Math.hypot((p[2]-x)*cs,p[1]-y)*.6;if(e<d)d=e}if(d>bs){bs=d;best=[x,y]}}
   if(best&&bs*k>34)out.push([code,best[0],best[1]])}
  return LBL[key]=out}
function drawLabels(key,B,P,lon0,lon1,latc,hi,size,avoid){mapLabels(key,B,lon0,lon1,latc,avoid).forEach(([code,x,y])=>{const[px,py]=P(x,y),on=code==hi;tx(PNAME[+code-1],px,py+size*.35,on?size*1.9:size,on?C.led:C.muted,"center",on?900:700)})}
function geoMap(B,lon0,lon1,latc,hi,rev){const cs=Math.cos(latc*Math.PI/180),k=B.w/((lon1-lon0)*cs),P=(lon,lat)=>[B.x+(lon-lon0)*cs*k,B.y+B.h/2-(lat-latc)*k];
  c.save();c.beginPath();c.rect(B.x,B.y,Math.min(rev,B.w),B.h);c.clip();c.fillStyle="#060912";c.fillRect(B.x,B.y,B.w,B.h);c.lineJoin="round";
  for(const code in PREF){const on=code==hi;c.fillStyle=on?"#4a370f":"#151c33";c.strokeStyle=on?C.led:"#3a4673";c.lineWidth=on?5:2.5;
   PREF[code].forEach(r=>{c.beginPath();r.forEach(([lo,la],i)=>{const[x,y]=P(lo,la);i?c.lineTo(x,y):c.moveTo(x,y)});c.closePath();c.fill();c.stroke()})}
  if(hi)PREF[hi].forEach(r=>{c.strokeStyle=C.led;c.lineWidth=5;c.beginPath();r.forEach(([lo,la],i)=>{const[x,y]=P(lo,la);i?c.lineTo(x,y):c.moveTo(x,y)});c.closePath();c.stroke()});
  (D.net||[]).forEach(([col,pts])=>{c.globalAlpha=.42;c.strokeStyle=col;c.lineWidth=k>900?3:2;c.beginPath();pts.forEach(([lo,la],i)=>{const[x,y]=P(lo,la);i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke()});c.globalAlpha=1;
  c.restore();c.strokeStyle=C.line;c.lineWidth=3;c.strokeRect(B.x,B.y,Math.min(rev,B.w),B.h);return P}

// 羽の生えたお札。flap(-1〜1)で羽ばたく
function bill(x,y,sc,flap,al){if(al<=0)return;c.save();c.globalAlpha=al;c.translate(x,y);c.scale(sc,sc);c.rotate(flap*.08);
  [-1,1].forEach(d=>{c.save();c.translate(d*26,-8);c.rotate(d*(-.55+flap*.55));c.fillStyle="#f4f5f7";c.beginPath();c.ellipse(d*20,-6,24,11,0,0,7);c.fill();c.beginPath();c.ellipse(d*14,4,17,8,0,0,7);c.fill();c.restore()});
  c.fillStyle="#3fae6a";c.strokeStyle="#1f7a45";c.lineWidth=3;c.beginPath();c.roundRect(-32,-18,64,36,4);c.fill();c.stroke();
  c.fillStyle="#d8f5e1";c.beginPath();c.arc(0,0,11,0,7);c.fill();c.fillStyle="#1f7a45";c.font=`900 17px ${F}`;c.textAlign="center";c.textBaseline="middle";c.fillText("¥",0,1);c.textBaseline="alphabetic";c.restore()}
// タクシーのピクトグラム(右向き、幅120)。spinで車輪が回る
function cab(x,y,spin){c.save();c.translate(x,y);
  c.fillStyle="#ffd23f";c.beginPath();c.moveTo(24,6);c.lineTo(84,6);c.lineTo(100,30);c.lineTo(14,30);c.closePath();c.fill();c.beginPath();c.roundRect(0,28,122,32,8);c.fill();
  c.fillStyle="#ff7a1a";c.fillRect(46,-6,26,12);
  c.fillStyle="#0b0e1c";c.beginPath();c.moveTo(30,12);c.lineTo(54,12);c.lineTo(54,28);c.lineTo(22,28);c.closePath();c.fill();c.beginPath();c.moveTo(60,12);c.lineTo(80,12);c.lineTo(91,28);c.lineTo(60,28);c.closePath();c.fill();
  c.fillStyle="#fff6c9";c.fillRect(112,36,10,10);
  [28,94].forEach(wx=>{c.fillStyle="#0b0e1c";c.beginPath();c.arc(wx,60,15,0,7);c.fill();c.strokeStyle="#8f97b8";c.lineWidth=4;c.beginPath();c.moveTo(wx-Math.cos(spin)*9,60-Math.sin(spin)*9);c.lineTo(wx+Math.cos(spin)*9,60+Math.sin(spin)*9);c.stroke()});
  c.restore()}
// 黒地図風の背景。実在の地図ではなく、環状線と放射路線をイメージした架空の路線網
let MAP=null;
function buildMap(){const m=document.createElement("canvas");m.width=W+400;m.height=H+300;const g=m.getContext("2d");let sd=20261005;const R=()=>{sd|=0;sd=sd+0x6D2B79F5|0;let t=Math.imul(sd^sd>>>15,1|sd);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  g.fillStyle="#04060b";g.fillRect(0,0,m.width,m.height);g.lineCap="round";
  const ang=[.18,.18+Math.PI/2,1.02,1.02+Math.PI/2];
  for(let i=0;i<620;i++){const x=R()*m.width,y=R()*m.height,a=ang[i%4],l=40+R()*170;g.strokeStyle="#111829";g.lineWidth=2;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke()}
  for(let i=0;i<16;i++){const x=R()*m.width,y=R()*m.height,a=ang[i%4]+(R()-.5)*.1;g.strokeStyle="#1a2440";g.lineWidth=5;g.beginPath();g.moveTo(x-Math.cos(a)*1600,y-Math.sin(a)*1600);g.lineTo(x+Math.cos(a)*1600,y+Math.sin(a)*1600);g.stroke()}
  g.strokeStyle="#0a1a36";g.lineWidth=54;g.beginPath();g.moveTo(-50,980);g.bezierCurveTo(600,820,900,1250,1500,1040);g.bezierCurveTo(1900,900,2100,1150,2400,1000);g.stroke();
  const cx=m.width/2,cy=m.height/2;MAP={m,cx,cy,lines:[]};
  for(let i=0;i<9;i++){let a=i*Math.PI*2/9+R()*.3,x=cx+Math.cos(a)*170,y=cy+Math.sin(a)*110;const pts=[[x,y]];for(let k=0;k<7;k++){a+=(R()-.5)*.5;x+=Math.cos(a)*190;y+=Math.sin(a)*190;pts.push([x,y])}MAP.lines.push(pts)}
  g.strokeStyle="#5a3f10";g.lineWidth=6;g.lineJoin="round";MAP.lines.forEach(p=>{g.beginPath();p.forEach(([x,y],k)=>k?g.lineTo(x,y):g.moveTo(x,y));g.stroke()});
  g.beginPath();g.ellipse(cx,cy,170,110,0,0,7);g.stroke();

let T=0,playing=false,speed=1,prev=0;
function render(){
  S=SC[SC.length-1];for(const s of SC)if(T<s.start+s.dur){S=s;break}
  lt=Math.min(T-S.start,S.dur);stars();draw[S.k]();subtitle();
  const fa=Math.min(cl(lt/.35),cl((S.dur-lt)/.35));if(fa<1&&T>0&&T<TOTAL){c.fillStyle=`rgba(8,10,20,${1-fa})`;c.fillRect(0,0,W,884)}
  c.fillStyle=C.led;c.fillRect(0,1074,W*T/TOTAL,6);
  const f=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
  document.getElementById("time").textContent=f(T)+" / "+f(TOTAL);document.getElementById("seek").value=Math.round(T/TOTAL*1000);
}
function loop(ts){if(!playing)return;T+=Math.min(.1,(ts-prev)/1000)*speed;prev=ts;if(T>=TOTAL){T=TOTAL;setPlay(false)}render();if(playing)requestAnimationFrame(loop)}
function setPlay(p){playing=p;document.getElementById("play").textContent=p?"一時停止":(T>=TOTAL?"最初から":"再生");if(p){prev=performance.now();requestAnimationFrame(loop)}}
document.getElementById("play").addEventListener("click",()=>{if(!playing&&T>=TOTAL)T=0;setPlay(!playing)});
document.getElementById("seek").addEventListener("input",e=>{T=e.target.value/1000*TOTAL;render();if(!playing)setPlay(false)});
document.getElementById("speed").addEventListener("change",e=>speed=+e.target.value);
document.getElementById("full").addEventListener("click",()=>{const s=document.getElementById("stage");try{(document.fullscreenElement?document.exitFullscreen():s.requestFullscreen()).catch(()=>{})}catch(e){}});
document.addEventListener("keydown",e=>{if(e.code=="Space"&&!/BUTTON|SELECT|INPUT/.test(e.target.tagName)){e.preventDefault();document.getElementById("play").click()}});
render();
